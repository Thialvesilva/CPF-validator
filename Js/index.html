<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de CPF</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="icon">
                CPF
            </div>

            <h1>Validador de CPF</h1>

            <p class="descricao">
                Digite um CPF abaixo para verificar se ele é válido.
            </p>

            <div class="campo">
                <label for="cpf">CPF</label>

                <input 
                    type="text" 
                    id="cpf" 
                    placeholder="000.000.000-00"
                    maxlength="14"
                >
            </div>

            <button id="validar">
                Validar CPF
            </button>

            <div id="resultado" class="resultado">
                Digite um CPF para começar
            </div>

        </div>

    </main>

</body>
</html>
